<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestion des catégories</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen p-6">

    <h1 class="text-2xl font-bold text-gray-800 mb-6">
        Gestion des catégories
    </h1>

    <button
        type="button"
        class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700"
        id="nouveaucat">
        Ajouter une catégorie
    </button>


    <form id="form" hidden class="bg-white p-6 rounded-lg shadow-sm mt-6 max-w-2xl">

        <div class="mb-4">
            <label
                for="nom"
                class="block text-sm font-medium text-gray-700 mb-2">
                Nom :
            </label>

            <input
                type="text"
                id="nom"
                required
                class="border border-gray-300 rounded-lg w-full p-2
                       focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>


        <div class="mb-4">
            <label
                for="description"
                class="block text-sm font-medium text-gray-700 mb-2">
                Description :
            </label>

            <textarea
                id="description"
                required
                class="border border-gray-300 rounded-lg w-full p-2
                       focus:outline-none focus:ring-2 focus:ring-blue-500">
            </textarea>
        </div>


        <button
            type="submit"
            id="submit"
            class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
            Ajouter
        </button>

        <button
            type="button"
            id="annuler"
            class="ml-2 bg-white text-gray-600 border border-gray-300
                   px-4 py-2 rounded-lg hover:bg-gray-50">
            Annuler
        </button>

    </form>


    <div class="bg-white rounded-lg shadow-sm mt-6 overflow-hidden">

        <table class="w-full">

            <thead class="bg-gray-50">

                <tr>
                    <th class="text-left text-xs text-gray-500 uppercase p-4">
                        ID
                    </th>

                    <th class="text-left text-xs text-gray-500 uppercase p-4">
                        Nom
                    </th>

                    <th class="text-left text-xs text-gray-500 uppercase p-4">
                        Description
                    </th>
                </tr>

            </thead>

            <tbody id="tbody">

            </tbody>

        </table>

    </div>


    <script src="js/script.js"></script>

</body>

</html>
