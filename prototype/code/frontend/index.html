<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des catégories</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen p-8">

    <div id="categories" class="max-w-5xl mx-auto">

        <h1 class="text-3xl font-bold text-gray-800 mb-6">
            Gestion des catégories
        </h1>
        <button
            id="ajouterBtton"
            type="button"
        class="bg-blue-600 text-white px-5 py-2 rounded-lg hover:bg-blue-700 mb-6">
            Ajouter catégorie
        </button>
        <form id="formCategorie" hidden class="bg-white p-6 rounded-lg shadow-md mb-6">
            <div class="mb-4">
                <label for="nom" class="block text-gray-700 font-medium mb-2">
                    Nom de catégorie</label>
            <input id="nom" type="text" class="w-full border border-gray-300 rounded-lg px-4 py-2">
        </div>
        <div class="mb-4">
        <label for="description" class="block text-gray-700 font-medium mb-2">Description</label>
        <textarea id="description" class="w-full border border-gray-300 rounded-lg px-4 py-2"></textarea>
            </div>
        <button type="submit" class="bg-green-600 text-white px-5 py-2 rounded-lg hover:bg-green-700 mr-2">
                Ajouter</button>
        <button type="button" id="AnnulerButton" class="bg-gray-500 text-white px-5 py-2 rounded-lg hover:bg-gray-600">
                Annuler</button>
        </form>
        <div class="bg-white rounded-lg shadow-md overflow-hidden">
        <table class="w-full text-left border-collapse">
        <thead class="bg-gray-200">
        <tr>
        <th class="border px-4 py-3">Id</th>
        <th class="border px-4 py-3">Nom</th>
        <th class="border px-4 py-3">Description</th>
        </tr></thead>
    <tbody id="tbody"></tbody>
</table></div></div>
<script src="js/script.js"></script>
</body>
</html>
