<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestion des catégories</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

    <div class="min-h-screen flex">

        <!-- Sidebar: hidden on mobile, visible from md screens -->
        <aside class="hidden md:block w-64 shrink-0 bg-gray-800 text-white p-6">

            <h2 class="text-xl font-bold mb-8">
                Gestion
            </h2>

            <nav class="space-y-3">

                <a href="#"
                   class="block p-3 rounded-lg hover:bg-gray-700">
                    Dashboard
                </a>

                <a href="#categories"
                   class="block p-3 rounded-lg bg-gray-700">
                    Catégories
                </a>

            </nav>

        </aside>

        <!-- Main content -->
        <main class="flex-1 min-w-0 p-4 md:p-8">

            <div id="categories" class="max-w-5xl mx-auto">

                <h1 class="text-2xl md:text-3xl font-bold text-gray-800 mb-6">
                    Gestion des catégories
                </h1>

                <!-- Add category button -->
                <button
                    id="ajouterBtton"
                    type="button"
                    class="bg-blue-600 text-white px-5 py-2 rounded-lg hover:bg-blue-700 mb-6">

                    Ajouter catégorie

                </button>

                <!-- Category form -->
                <form
                    id="formCategorie"
                    hidden
                    class="bg-white p-6 rounded-lg shadow-md mb-6">

                    <div class="mb-4">

                        <label
                            for="nom"
                            class="block text-gray-700 font-medium mb-2">

                            Nom de catégorie

                        </label>

                        <input
                            id="nom"
                            type="text"
                            required
                            class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">

                    </div>

                    <div class="mb-4">

                        <label
                            for="description"
                            class="block text-gray-700 font-medium mb-2">

                            Description

                        </label>

                        <textarea
                            id="description"
                            required
                            class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>

                    </div>

                    <!-- Submit button with spinner -->
                    <button
                        id="btnSubmit"
                        type="submit"
                        class="bg-green-600 text-white px-5 py-2 rounded-lg hover:bg-green-700 mr-2 disabled:opacity-50 disabled:cursor-not-allowed">

                        <span id="btnText">Ajouter</span>

                        <span
                            id="spinner"
                            class="hidden w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin ml-2 align-middle">
                        </span>

                    </button>

                    <!-- Cancel button -->
                    <button
                        id="AnnulerButton"
                        type="button"
                        class="bg-gray-500 text-white px-5 py-2 rounded-lg hover:bg-gray-600">

                        Annuler

                    </button>

                </form>
                <p id="emptyMessage" hidden class="text-center text-gray-500 p-4">
    Aucune catégorie disponible.
</p>

                <!-- Categories table -->
                <div class="bg-white rounded-lg shadow-md overflow-x-auto">

                    <table class="w-full text-left border-collapse">

                        <thead class="bg-gray-200">

                            <tr>
                                <th class="border px-4 py-3">Id</th>
                                <th class="border px-4 py-3">Nom</th>
                                <th class="border px-4 py-3">Description</th>
                            </tr>

                        </thead>

                        <tbody id="tbody"></tbody>

                    </table>

                </div>

            </div>

        </main>

    </div>

    <!-- Toast notifications -->
    <div
        id="toast"
        class="fixed top-4 right-4 z-50 flex flex-col gap-2">
    </div>

    <!-- JavaScript -->
<script src="assests/js/app.js"></script>
</body>
</html>
